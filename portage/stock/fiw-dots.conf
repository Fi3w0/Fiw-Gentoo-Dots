# Portable flags for small source builds; existing hardware settings stay separate.
COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
USE="${USE} wayland pipewire vaapi vulkan dist-kernel -gtk-doc"
FEATURES="${FEATURES} buildpkg getbinpkg parallel-fetch"
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"
L10N="en es"
INPUT_DEVICES="libinput"
