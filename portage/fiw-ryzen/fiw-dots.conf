# Stable base; testing (~amd64) is enabled per package only. Do not set ACCEPT_KEYWORDS here.
COMMON_FLAGS="-march=znver5 -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="${RUSTFLAGS} -C target-cpu=znver5"

MAKEOPTS="-j16 -l24"
# Out-of-tree modules must match the local kernel build: never use binhost packages for these.
EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=24 --with-bdeps=y --getbinpkg --usepkg-exclude=x11-drivers/nvidia-drivers --usepkg-exclude=sys-kernel/gentoo-kernel --usepkg-exclude=app-arch/zip --usepkg-exclude=app-misc/fastfetch --usepkg-exclude=app-misc/jq --rebuilt-binaries=n"
FEATURES="buildpkg getbinpkg parallel-fetch"

PORTAGE_TMPDIR="/var/tmp"

VIDEO_CARDS="amdgpu radeonsi nvidia"
INPUT_DEVICES="libinput"
USE="wayland pipewire vaapi vulkan dist-kernel -gtk-doc"
L10N="en es"

ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"
LC_MESSAGES=C.UTF-8
