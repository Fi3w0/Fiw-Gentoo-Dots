# Installed as /etc/sysctl.d/70-fiw-dots-performance.conf (Fiw's Ryzen preset)
# Desktop/gaming tuning, mostly from CachyOS-Settings (70-cachyos-settings.conf).
# swappiness 100 / page-cluster 0 (zram) and nmi_watchdog 0 already come from the CachyOS patch.

# Games under Proton (CS2, Star Citizen, Hogwarts Legacy...) need many memory maps.
# Gentoo default 65530; Arch/CachyOS/Fedora use 1048576.
vm.max_map_count = 1048576

# Keep directory/inode cache longer (default 100).
vm.vfs_cache_pressure = 50

# Flush dirty pages in small chunks instead of % of 32 GB RAM: fewer stalls on big writes.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500

# Bigger network receive queue.
net.core.netdev_max_backlog = 4096

# TCP BBR congestion control with fq pacing (module loaded by modules-load.d/bbr.conf).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
