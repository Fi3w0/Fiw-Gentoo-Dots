# MangoHud detail presets — cycle with Right Shift + F10.
# Order: 0 off → 1 basic → 2 more info → 3 even more → 4 all info.
# (Appearance + fps_metrics/1%-low come from MangoHud.conf and apply to all.)

[preset 0]
# OFF
no_display

[preset 1]
# BASIC — framerate only (with avg / 1% low / 0.1% low)
fps

[preset 2]
# MORE INFO — fps + CPU/GPU load & temp + VRAM/RAM
fps
frametime=1
frame_timing=1
cpu_stats
cpu_temp
cpu_load_change
gpu_stats
gpu_temp
gpu_load_change
vram
ram

[preset 3]
# EVEN MORE — adds clocks, power draw, per-core load, swap
fps
frametime=1
frame_timing=1
cpu_stats
cpu_temp
cpu_mhz
cpu_power
cpu_load_change
core_load
gpu_stats
gpu_temp
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_load_change
vram
ram
swap

[preset 4]
# ALL INFO — everything (junction temp, fan, per-process mem)
fps
frametime=1
frame_timing=1
cpu_stats
cpu_temp
cpu_mhz
cpu_power
cpu_load_change
core_load
core_load_change
gpu_stats
gpu_temp
gpu_junction_temp
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_fan
gpu_load_change
vram
ram
swap
procmem
