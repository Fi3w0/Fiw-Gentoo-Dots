# MangoHud — base appearance + Steam-Deck-style detail presets.
# Cycle detail level:  Right Shift + F10   (off → basic → more → even more → all)
# Toggle overlay on/off: Right Shift + F12
# Detail levels are defined in presets.conf (same folder).

### Appearance (applies to all presets)
legacy_layout=false
horizontal=false
position=top-left
font_size=20
background_alpha=0.5
alpha=0.9
round_corners=8
table_columns=3

### FPS line: color-coded + average / 1% low / 0.1% low ("real" perceived fps)
fps_color_change
fps_metrics=avg,0.01,0.001

### Presets to cycle through with toggle_preset (Right Shift + F10).
### This MUST be a list, not a single value, or cycling won't move.
### Order = cycle order. Starts at the first (basic), ascends, then off, then wraps.
preset=1,2,3,4,0

### FPS limit — stays UNCAPPED by default (best for CS2 / competitive: more
### frames = lower input latency even above refresh). Tap Right Shift + F1 in-game
### to cycle: uncapped -> 144 -> 120 -> uncapped. Use a cap only when you want it.
fps_limit=0,144,120

### Keybinds
toggle_preset=Shift_R+F10
toggle_hud=Shift_R+F12
toggle_fps_limit=Shift_R+F1
