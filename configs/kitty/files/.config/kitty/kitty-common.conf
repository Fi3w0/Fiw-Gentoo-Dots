# Shared typography and window settings
font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0

shell fish
linux_display_server auto
background_blur 32
dynamic_background_opacity yes

window_padding_width 12
confirm_os_window_close 0

# Comfortable contrast for shell output
url_color #B9AEE6
url_style curly
selection_foreground #181521
selection_background #9D8FD9
cursor #DDDAEC
cursor_text_color #181521

# Remielle lilac palette, nudged toward Gentoo purples (#54487A / #6E56AF / #DDDAEC)
color0  #25203A
color1  #C4759F
color2  #B2B2CB
color3  #D5B5DB
color4  #7A6BB8
color5  #9D8FD9
color6  #CDCFD9
color7  #E5D9DF
color8  #6E608F
color9  #D2AABA
color10 #D8D2E8
color11 #EBD6ED
color12 #B9AEE6
color13 #DDDAEC
color14 #B2B2CB
color15 #F7F1F6
